name: Validate Luna App Builder

"on":
  pull_request:
  push:
    branches:
      - main
      - "setup/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luna-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation, autonomy and three-mode smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate deterministic integrity manifest
        run: python scripts/generate_integrity_manifest.py

      - name: Upload generated manifest
        uses: actions/upload-artifact@v4
        with:
          name: generated-integrity-manifest
          path: integrity-manifest.json
          if-no-files-found: error

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate repository structure and integrity
        run: python scripts/validate_repository.py

      - name: Parse scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find scripts skills -type f -name '*.sh' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find scripts skills -type f -name '*.mjs' -print0)

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts, skills -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell non valido: $($_.FullName)`n$($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke test install, autonomous state, bootstrap dry-run and Doctor
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          native=(app-builder app-builder-doctor app-builder-handoff app-builder-about app-product-discovery app-requirements-mvp app-ux-accessibility app-brand-assets app-copywriting app-project-adoption app-security-orchestrator)

          for mode in personal prototype publication; do
            sandbox="$root/$mode"
            mkdir -p "$sandbox"
            bash scripts/install.sh --scope project --project "$sandbox"
            bash scripts/init-project.sh --name "Test $mode" --mode "$mode" --path "$sandbox"

            for skill in "${native[@]}"; do test -f "$sandbox/.agents/skills/$skill/SKILL.md"; done
            for doc in PROJECT_VISION.md PRODUCT_DISCOVERY.md REQUIREMENTS.md BRAND.md ASSET_INVENTORY.md USER_FLOWS.md ACCESSIBILITY.md COPY_SYSTEM.md SECURITY_PLAN.md; do test -f "$sandbox/docs/$doc"; done

            grep -q "Project mode: $mode" "$sandbox/.app-builder/state.md"
            grep -q "Project origin: new" "$sandbox/.app-builder/state.md"
            grep -q "Adoption status: not_applicable" "$sandbox/.app-builder/state.md"
            grep -q "Bootstrap status: pending" "$sandbox/.app-builder/state.md"
            grep -q "Current specialist: app-builder-doctor" "$sandbox/.app-builder/state.md"
            grep -q "Phase 0 — Preflight, bootstrap and adoption" "$sandbox/.app-builder/state.md"

            if grep -R -nE '\{\{?(PROJECT_NAME|PROJECT_MODE|PROJECT_ROOT|PROJECT_ORIGIN|ADOPTION_STATUS|DATE)\}?\}' "$sandbox/.app-builder" "$sandbox/docs"; then
              echo "Sono rimasti placeholder non renderizzati in $mode" >&2
              exit 1
            fi
            if grep -R -nE 'â€“|â€”|Ã.|ï»¿' "$sandbox/.app-builder" "$sandbox/docs"; then
              echo "Trovato testo UTF-8 corrotto in $mode" >&2
              exit 1
            fi

            python - "$sandbox/.app-builder/config.json" "$mode" <<'PY'
          import json, pathlib, sys
          config = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8-sig"))
          expected = sys.argv[2]
          assert config["project"]["mode"] == expected
          assert config["project"]["origin"] == "new"
          assert config["project"]["adoptionStatus"] == "not_applicable"
          assert config["project"]["stateOwner"] == "current-session"
          assert config["appBuilder"]["routing"] == "autonomous"
          assert config["routing"]["askUserToChooseSkill"] is False
          assert config["bootstrap"]["automaticAfterConsent"] is True
          assert config["bootstrap"]["securityCatalog"]["activateOnDemandOnly"] is True
          assert config["workflow"]["twoChats"] is False
          PY

            node "$sandbox/.agents/skills/app-builder/scripts/bootstrap-specialists.mjs" --project "$sandbox" --dry-run
            test -f "$sandbox/.app-builder/specialists.json"
            test -f "$sandbox/.app-builder/bootstrap-report.md"
            grep -q "dry_run" "$sandbox/.app-builder/specialists.json"
            grep -q "on_demand_only" "$sandbox/.app-builder/specialists.json"

            bash scripts/doctor.sh --project "$sandbox" --mode "$mode" --output .app-builder/doctor-report.md
            grep -q "11 skill native rilevate" "$sandbox/.app-builder/doctor-report.md"
            grep -q "Specialist bootstrap" "$sandbox/.app-builder/doctor-report.md"
          done

          existing="$root/existing"
          mkdir -p "$existing"
          printf '{"name":"existing-app","private":true}\n' > "$existing/package.json"
          bash scripts/install.sh --scope project --project "$existing"
          bash scripts/init-project.sh --name "Existing Test" --mode prototype --path "$existing"
          grep -q "Project origin: existing" "$existing/.app-builder/state.md"
          grep -q "Adoption status: pending" "$existing/.app-builder/state.md"
          bash scripts/doctor.sh --project "$existing" --mode prototype --output .app-builder/doctor-report.md
          grep -q "Existing project adoption" "$existing/.app-builder/doctor-report.md"
          grep -q "missing_required" "$existing/.app-builder/doctor-report.md"

          bash scripts/verify-integrity.sh "$GITHUB_WORKSPACE"

  windows:
    name: Windows autonomy, UTF-8 and three-mode smoke test
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate deterministic integrity manifest
        run: python scripts/generate_integrity_manifest.py

      - name: Parse PowerShell and Node scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts, skills -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell non valido: $($_.FullName)`n$($errors | Out-String)"
            }
          }
          Get-ChildItem scripts, skills -Recurse -File -Filter *.mjs | ForEach-Object {
            & node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Smoke test install, autonomous state, bootstrap dry-run and Doctor
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $root = Join-Path $env:RUNNER_TEMP "luna-smoke-$([guid]::NewGuid())"
          $native = @("app-builder","app-builder-doctor","app-builder-handoff","app-builder-about","app-product-discovery","app-requirements-mvp","app-ux-accessibility","app-brand-assets","app-copywriting","app-project-adoption","app-security-orchestrator")
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          try {
            foreach ($mode in @("personal", "prototype", "publication")) {
              $sandbox = Join-Path $root $mode
              New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
              & (Join-Path $repo "scripts/install.ps1") -Scope Project -ProjectPath $sandbox
              & (Join-Path $repo "scripts/init-project.ps1") -ProjectName "Test $mode" -Mode $mode -ProjectPath $sandbox

              foreach ($skill in $native) {
                if (-not (Test-Path (Join-Path $sandbox ".agents/skills/$skill/SKILL.md"))) { throw "Skill $skill non installata" }
              }
              foreach ($doc in @("PROJECT_VISION.md","PRODUCT_DISCOVERY.md","REQUIREMENTS.md","BRAND.md","ASSET_INVENTORY.md","USER_FLOWS.md","ACCESSIBILITY.md","COPY_SYSTEM.md","SECURITY_PLAN.md")) {
                if (-not (Test-Path (Join-Path $sandbox "docs/$doc"))) { throw "Documento $doc mancante" }
              }

              $statePath = Join-Path $sandbox ".app-builder/state.md"
              $state = Get-Content -LiteralPath $statePath -Raw -Encoding UTF8
              if ($state -notmatch "Project mode: $mode") { throw "Modalità non renderizzata" }
              if ($state -notmatch "Project origin: new") { throw "Origine progetto errata" }
              if ($state -notmatch "Adoption status: not_applicable") { throw "Adozione progetto nuovo errata" }
              if ($state -notmatch "Bootstrap status: pending") { throw "Bootstrap state mancante" }
              if ($state -notmatch "Current specialist: app-builder-doctor") { throw "Routing iniziale errato" }
              if ($state -notmatch "Phase 0 — Preflight, bootstrap and adoption") { throw "UTF-8 o fase errata" }
              $badUtf8Prefixes = @([char]0x00E2, [char]0x00C3, [char]0x00EF)
              if ($badUtf8Prefixes | Where-Object { $state.Contains([string]$_) }) { throw "Testo UTF-8 corrotto" }

              $config = Get-Content -LiteralPath (Join-Path $sandbox ".app-builder/config.json") -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($config.project.mode -ne $mode -or $config.project.origin -ne "new") { throw "Config progetto errato" }
              if ($config.appBuilder.routing -ne "autonomous") { throw "Routing config errato" }
              if ($config.routing.askUserToChooseSkill -ne $false) { throw "Scelta skill scaricata sull'utente" }
              if ($config.bootstrap.automaticAfterConsent -ne $true) { throw "Bootstrap non automatico" }
              if ($config.bootstrap.securityCatalog.activateOnDemandOnly -ne $true) { throw "Catalogo sicurezza troppo attivo" }

              $bootstrap = Join-Path $sandbox ".agents/skills/app-builder/scripts/bootstrap-specialists.mjs"
              & node $bootstrap --project $sandbox --dry-run
              if ($LASTEXITCODE -ne 0) { throw "Bootstrap dry-run fallito" }
              if (-not (Test-Path (Join-Path $sandbox ".app-builder/specialists.json"))) { throw "Registry bootstrap mancante" }

              & (Join-Path $repo "scripts/doctor.ps1") -ProjectPath $sandbox -Mode $mode -OutputPath ".app-builder/doctor-report.md"
              $report = Get-Content (Join-Path $sandbox ".app-builder/doctor-report.md") -Raw -Encoding UTF8
              if ($report -notmatch "11 skill native rilevate") { throw "Doctor non rileva le skill native" }
            }

            $existing = Join-Path $root "existing"
            New-Item -ItemType Directory -Force -Path $existing | Out-Null
            '{"name":"existing-app","private":true}' | Set-Content (Join-Path $existing "package.json") -Encoding UTF8
            & (Join-Path $repo "scripts/install.ps1") -Scope Project -ProjectPath $existing
            & (Join-Path $repo "scripts/init-project.ps1") -ProjectName "Existing Test" -Mode prototype -ProjectPath $existing
            $existingState = Get-Content (Join-Path $existing ".app-builder/state.md") -Raw -Encoding UTF8
            if ($existingState -notmatch "Project origin: existing" -or $existingState -notmatch "Adoption status: pending") { throw "Origine existing non renderizzata" }
            & (Join-Path $repo "scripts/doctor.ps1") -ProjectPath $existing -Mode prototype -OutputPath ".app-builder/doctor-report.md"
            $existingReport = Get-Content (Join-Path $existing ".app-builder/doctor-report.md") -Raw -Encoding UTF8
            if ($existingReport -notmatch "Existing project adoption" -or $existingReport -notmatch "missing_required") { throw "Adozione progetto esistente non rilevata" }

            & (Join-Path $repo "scripts/verify-integrity.ps1") -RootPath $repo
          }
          finally {
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }
