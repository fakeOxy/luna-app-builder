name: Validate Luna App Builder

"on":
  pull_request:
  push:
    branches:
      - main
      - "setup/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luna-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate repository structure and integrity
        run: python scripts/validate_repository.py

      - name: Parse Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts skills -type f -name '*.sh' -print0)

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts, skills -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell non valido: $($_.FullName)`n$($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke test Bash install, init, Doctor and integrity
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          bash scripts/install.sh --scope project --project "$sandbox"
          bash scripts/init-project.sh --name "App di prova" --mode personal --path "$sandbox"
          test -f "$sandbox/.agents/skills/app-builder/SKILL.md"
          test -f "$sandbox/.app-builder/state.md"
          test -f "$sandbox/docs/PROJECT_VISION.md"
          if grep -R -nE '\{\{(PROJECT_NAME|PROJECT_MODE|PROJECT_ROOT|DATE)\}\}' "$sandbox/.app-builder" "$sandbox/docs"; then
            echo "Sono rimasti placeholder non renderizzati" >&2
            exit 1
          fi
          bash scripts/doctor.sh --project "$sandbox" --mode personal --output .app-builder/doctor-report.md
          grep -q "# App Builder Doctor" "$sandbox/.app-builder/doctor-report.md"
          bash scripts/verify-integrity.sh "$GITHUB_WORKSPACE"

  windows:
    name: Windows PowerShell smoke test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts, skills -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell non valido: $($_.FullName)`n$($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke test PowerShell install, init, Doctor and integrity
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $sandbox = Join-Path $env:RUNNER_TEMP "luna-smoke-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          try {
            & (Join-Path $repo "scripts/install.ps1") -Scope Project -ProjectPath $sandbox
            & (Join-Path $repo "scripts/init-project.ps1") -ProjectName "App di prova" -Mode personal -ProjectPath $sandbox
            if (-not (Test-Path (Join-Path $sandbox ".agents/skills/app-builder/SKILL.md"))) { throw "Skill non installata" }
            if (-not (Test-Path (Join-Path $sandbox ".app-builder/state.md"))) { throw "Stato non creato" }
            if (-not (Test-Path (Join-Path $sandbox "docs/PROJECT_VISION.md"))) { throw "Documenti non creati" }
            $rendered = Get-ChildItem (Join-Path $sandbox ".app-builder"), (Join-Path $sandbox "docs") -Recurse -File |
              Select-String -Pattern '\{\{(PROJECT_NAME|PROJECT_MODE|PROJECT_ROOT|DATE)\}\}'
            if ($rendered) { throw "Sono rimasti placeholder non renderizzati" }
            & (Join-Path $repo "scripts/doctor.ps1") -ProjectPath $sandbox -Mode personal -OutputPath ".app-builder/doctor-report.md"
            if (-not (Select-String -Path (Join-Path $sandbox ".app-builder/doctor-report.md") -Pattern "# App Builder Doctor" -Quiet)) {
              throw "Report Doctor non valido"
            }
            & (Join-Path $repo "scripts/verify-integrity.ps1") -RootPath $repo
          }
          finally {
            Remove-Item $sandbox -Recurse -Force -ErrorAction SilentlyContinue
          }
