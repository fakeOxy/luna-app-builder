name: Refresh Luna Integrity Manifest

"on":
  push:
    branches:
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luna-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh SHA-256 manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate deterministic integrity manifest
        run: python scripts/generate_integrity_manifest.py

      - name: Commit refreshed manifest
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- integrity-manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add integrity-manifest.json
            git commit -m "chore: refresh integrity manifest"
            git push
          fi
