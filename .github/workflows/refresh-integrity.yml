name: Refresh Luna Integrity Manifest

"on":
  push:
    branches:
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: luna-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh committed SHA-256 manifest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout trusted repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate deterministic manifest
        run: python scripts/generate_integrity_manifest.py

      - name: Commit only the manifest when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- integrity-manifest.json; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- integrity-manifest.json
          git commit -m "chore: refresh integrity manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"
